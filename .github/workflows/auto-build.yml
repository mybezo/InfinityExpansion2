name: Auto Build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: ./gradlew clean shadowJar

      - name: Get build info
        id: info
        run: |
          JAR_PATH=$(ls build/libs/InfinityExpansion2-*.jar | head -n 1)
          FILENAME=$(basename "$JAR_PATH")
          VERSION=${FILENAME#InfinityExpansion2-}
          VERSION=${VERSION%.jar}
          echo "jar=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built $FILENAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: InfinityExpansion2-${{ steps.info.outputs.version }}
          path: ${{ steps.info.outputs.jar }}
