name: Auto Build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: ./gradlew clean shadowJar

      - name: Get build info
        id: info
        run: |
          JAR_PATH=$(ls build/libs/InfinityExpansion2-*.jar | head -n 1)
          FILENAME=$(basename "$JAR_PATH")
          VERSION=${FILENAME#InfinityExpansion2-}
          VERSION=${VERSION%.jar}
          echo "jar=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Built $FILENAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: InfinityExpansion2-${{ steps.info.outputs.version }}
          path: ${{ steps.info.outputs.jar }}

      - name: Remove previous rolling release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.ref_name }}
        run: gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.ref_name }}
          name: Auto Build (${{ github.ref_name }}) - ${{ steps.info.outputs.version }}
          body: |
            Automated build from `${{ github.ref_name }}` at ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: ${{ steps.info.outputs.jar }}
